<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- The browser build fills the whole window (the user, 2026-10-17: no letterboxing): the canvas is the page -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f1c; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b0f1c; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 60vw); text-align: center;
                 font: 600 16px Georgia, serif; color: #e2b04a; letter-spacing: .08em; }
      #track { margin-top: 12px; height: 6px; background: #1d2742; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #e2b04a; transition: width .2s; }
      #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; background: #8a1a1a; color: #fff; font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">{{{ PRODUCT_NAME }}}<div id="track"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: window.devicePixelRatio,
        showBanner: function (message, type) {
          if (type !== "error") { console.log(message); return; }
          var box = document.querySelector("#error");
          box.textContent = message;
          box.style.display = "block";
        }
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        var box = document.querySelector("#error");
        box.textContent = message;
        box.style.display = "block";
      });
    </script>
  </body>
</html>
